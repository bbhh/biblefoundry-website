baseURL = "https://www.biblefoundry.com/"
languageCode = "en-US"
title = "BibleFoundry"
publishDir = "docs"
disableKinds = ["taxonomy", "term"]

[params]
description = "BibleFoundry makes digital tools for Bible study, prayer, and ministry."
mission = "Apps to build up the body of Christ"
email = "biblefoundry@gmail.com"
purpose = """
A prominent display of God’s common grace is His gift of technology, which has improved our quality of life in countless ways. Like many other God-given gifts, technology can be used either for God’s glory or for God’s displeasure.

My focus is to leverage technology for the edification of the body of Christ (Ephesians 4:11–16). I aim to develop apps that help *Christians* to grow in their love for Christ and His Word (Philippians 1:9–11), *pastors and ministers* to rightly handle the word of truth (2 Timothy 2:15), and *churches* to shine as a pillar and buttress of the truth (1 Timothy 3:15).
"""

[params.founder]
name = "Bryant Huang"
portrait = "img/team/bryant.jpg"
bio = """
Bryant was born and raised in Los Angeles. God, in His amazing grace, chose to save this sinner during high school. Bryant went on to complete his B.A. at UCLA and M.S. at USC in Computational Linguistics. While serving in the local church, he discovered the incomparable joy of teaching the Bible and seeing it bear fruit in people’s lives (Colossians 1:28), which led him to obtain an M.Div. from [The Master’s Seminary](https://tms.edu/) to be better equipped to feed and shepherd God’s people.

He is a member of [Immanuel Bible Church](https://ibcbible.org/) and works as a software engineer at Amazon. In his spare time, he enjoys eating good eats, making good eats from scratch, playing basketball, writing apps, reading books, learning languages, traveling, and especially spending time with his family. Bryant ministers with his wife Juliette and their five children.
"""

